name: Validate project

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run project contract tests
        run: python -m unittest discover -s tests -v

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell scripts without executing them
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell parse failed: $($file.Name)"
            }
            Write-Host "PowerShell syntax OK: $($file.Name)"
          }
